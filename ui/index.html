<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glass Map Protocol | Control Room</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .dashboard-container {
            display: grid; 
            grid-template-columns: 250px 1fr 450px; /* Force 3 columns */
            grid-template-rows: 100vh; /* Force full height */
            width: 100vw;
            height: 100vh;
            overflow: hidden; /* Stops the main page from scrolling */
            background-color: #2d2d2d; /* Grid line color */
            gap: 1px; 
        }
      
        .pane-content {
            flex: 1;
            overflow-y: auto; 
            padding: 15px;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        
        <!-- PANE 1: REPOSITORY (Left Column) -->
        <aside class="pane repo-pane">
            <div class="pane-header">Protocols / Data</div>
            <div class="pane-content">
                <ul class="file-list" id="file-selector">
                    <li class="file-item active" data-file="08055.yml">data/micro/08055.yml</li>
                    <li class="file-item" data-file="19103.yml">data/micro/19103.yml</li>
                </ul>
            </div>
        </aside>

        <!-- PANE 2: GLASS MAP (Center Column) -->
        <main class="pane map-pane">
            <div class="pane-header">
                <span id="map-title">Spatial View</span>
                <div class="map-controls">
                    <button class="map-btn">Borders</button>
                    <button class="map-btn">Aquifer</button>
                </div>
            </div>
            <div class="pane-content" style="display:flex; align-items:center; justify-content:center;">
                <div style="color: #444; text-align: center;">
                    [SVG MAP RENDERER]<br>
                    <small>08055_Polygon_Active</small>
                </div>
            </div>
        </main>

        <!-- PANE 3: LEDGER (Right Column) -->
        <aside class="pane pane-3">
            <div class="pane-header">Service Ledger</div>
            <div class="pane-content">
                </div>
            <div class="audit-console">
                </div>
        </aside>

    </div>

    <!-- YAML Parser for evening work -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
